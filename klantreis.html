<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A341E">
<title>UPKeepers Klantreis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Nunito+Sans:wght@400;600&display=swap">
<style>
:root{--zand:#ECE5D7;--creme:#F7F3EB;--inkt:#0A341E;--goud:#CBA45C}
html,body{margin:0;height:100%;background:var(--inkt)}
body{display:flex;flex-direction:column;font-family:'Nunito Sans',system-ui,sans-serif;color:var(--creme)}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.balk{flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:460px;width:100%;margin:0 auto}
.rollen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:3px;border-radius:999px;background:rgba(247,243,235,.1)}
.rol{position:relative;min-height:34px;border:0;border-radius:999px;background:transparent;color:var(--creme);font-size:14px}
.rol[aria-selected="true"]{background:var(--creme);color:var(--inkt)}
.rol .stip{position:absolute;top:6px;right:10px;width:7px;height:7px;border-radius:999px;background:var(--goud)}
.zet{display:flex;align-items:center;gap:10px}
.zet-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.zet-t small{font-size:11px;letter-spacing:.18em;color:rgba(247,243,235,.62)}
.zet-t span{font-size:14px;line-height:1.3}
.verder{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--goud);background:var(--goud);color:var(--inkt);font-size:14px;font-weight:600}
.verder.zacht{background:transparent;color:var(--goud)}
.mini{border:0;background:transparent;color:rgba(247,243,235,.62);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.scherm{flex:1 1 auto;min-height:0;display:flex;justify-content:center;background:var(--zand)}
iframe{border:0;width:100%;max-width:430px;height:100%;background:var(--zand);display:block}
@media (min-width:600px){.scherm{background:var(--inkt);padding:10px 0 24px}iframe{max-width:390px;max-height:844px;border-radius:32px;box-shadow:0 30px 80px -40px rgba(0,0,0,.6)}}
.blad{position:fixed;inset:0;z-index:5;background:rgba(10,52,30,.5);display:flex;align-items:flex-end;justify-content:center}
.blad>div{width:100%;max-width:460px;max-height:86%;overflow-y:auto;background:var(--creme);color:var(--inkt);border-radius:24px 24px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.blad h2{margin:0 0 6px;font-family:'Montserrat',sans-serif;font-weight:300;font-size:22px}
.stap{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(10,52,30,.1);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;font-size:15px}
.stap i{font-style:normal;flex:0 0 auto;width:24px;height:24px;border-radius:999px;border:1px solid rgba(10,52,30,.3);display:flex;align-items:center;justify-content:center;font-size:12px}
.stap.af i{background:var(--inkt);border-color:var(--inkt);color:var(--creme)}
.stap.nu i{background:var(--goud);border-color:var(--goud)}
.stap small{display:block;font-size:12px;letter-spacing:.14em;color:rgba(10,52,30,.6)}
.sluit{margin-top:14px;width:100%;min-height:48px;border-radius:999px;border:1px solid rgba(10,52,30,.2);background:transparent;color:var(--inkt);font-size:16px}
</style>
</head>
<body>
<div class="balk">
  <div class="rollen" role="tablist" aria-label="Rol" id="rollen"></div>
  <div class="zet">
    <div class="zet-t"><small id="stapnr"></small><span id="wat"></span></div>
    <button class="verder" id="verder" type="button"></button>
  </div>
  <div style="display:flex;justify-content:space-between"><button class="mini" id="reisknop" type="button">De hele reis</button><button class="mini" id="opnieuw" type="button">Opnieuw beginnen</button></div>
</div>
<div class="scherm"><iframe id="app" title="UPKeepers-app"></iframe></div>
<div id="blad"></div>
<script>
(function(){
  // De reis loopt over de echte canvasschermen; deze laag kiest alleen per stap en per rol welk scherm open staat.
  const ROLLEN = [['klant','Klant'],['admin','Klantenservice'],['vakman','Vakman']];
  const STD = { klant:'CStart', admin:'CAdmin', vakman:'CVakmanWerk' };
  const F = [
    { wie:'klant', wat:'Meld je aan en kies je lidmaatschap', klant:'GInlog?welkom=B', admin:'CAdminLeden' },
    { wie:'klant', wat:'Wat we al van je huis weten', klant:'WWelkomB' },
    { wie:'klant', wat:'Lisa ontvangt je', klant:'WOntvangst' },
    { wie:'klant', wat:'Je huis, je startscherm', klant:'CStart' },
    { wie:'klant', wat:'Meld de kozijnen en kies drie momenten', klant:'CMelden?klus=kozijnen' },
    { wie:'admin', wat:'Kies drie vakmannen, op volgorde', admin:'CAdminToewijzen', klant:'CKlussen' },
    { wie:'vakman', wat:'Bekijk de opdracht en neem hem aan', vakman:'CVakmanOpdracht', klant:'CKlussen', admin:'CAdminToewijzen' },
    { wie:'klant', wat:'Geregeld: je ziet wie er komt en wanneer', klant:'GMeldingen' },
    { wie:'vakman', wat:'De dag zelf: loop je uit?', vakman:'CKlusLater?t=1&klus=kozijnen', klant:'GMeldingen' },
    { wie:'klant', wat:'Marco komt later: kies je nieuwe tijd', klant:'CKlusLater?klus=kozijnen', vakman:'CKlusLater?t=1&klus=kozijnen' },
    { wie:'vakman', wat:'Onderweg, sleutel, aan het werk', vakman:'CVakmanKlus?fase=0', klant:'CKlus?klus=kozijnen' },
    { wie:'klant', wat:'Marco vond iets: beslis over zijn voorstel', klant:'CKlus?klus=kozijnen', vakman:'CVakmanKlus?fase=1' },
    { wie:'vakman', wat:'Foto’s, opnames en opleveren', vakman:'CVakmanKlus?fase=1', klant:'CKlus?klus=kozijnen' },
    { wie:'klant', wat:'Keur het werk goed', klant:'CGoedkeuren', vakman:'CVakmanWerk' },
    { wie:'admin', wat:'Sanne aan de telefoon: alles op één scherm', admin:'CAdmin', klant:'CStart' },
    { wie:null, wat:'Rond: je dossier is bijgewerkt, Marco wordt betaald', klant:'CDossier', vakman:'CVakmanGeld', admin:'CAdmin' }
  ];
  const lees = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  const zet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  zet('upk-welkom', 'B');
  let fase = Math.min(F.length - 1, Math.max(0, parseInt(lees('upk-reis-fase', '0'), 10) || 0));
  let rol = lees('upk-reis-rol', 'klant');
  const naam = id => (ROLLEN.find(r => r[0] === id) || [,''])[1];
  const app = document.getElementById('app');

  function scherm(){ const f = F[fase]; return f[rol] || STD[rol]; }
  function teken(laad){
    const f = F[fase];
    document.getElementById('rollen').innerHTML = ROLLEN.map(r => '<button class="rol" role="tab" type="button" data-rol="' + r[0] + '" aria-selected="' + (r[0] === rol) + '">' + r[1] + (f.wie === r[0] && r[0] !== rol ? '<span class="stip"></span>' : '') + '</button>').join('');
    document.getElementById('stapnr').textContent = 'STAP ' + (fase + 1) + ' VAN ' + F.length + (f.wie ? ' · AAN ZET: ' + naam(f.wie).toUpperCase() : ' · DE REIS IS ROND');
    document.getElementById('wat').textContent = f.wie && f.wie !== rol ? 'Wacht op ' + naam(f.wie).toLowerCase() + ': ' + f.wat.charAt(0).toLowerCase() + f.wat.slice(1) : f.wat;
    const v = document.getElementById('verder');
    if (f.wie && f.wie !== rol) { v.textContent = 'Naar ' + naam(f.wie).toLowerCase(); v.className = 'verder zacht'; v.dataset.doe = 'kijk'; }
    else if (fase < F.length - 1) { const n = F[fase + 1]; v.textContent = n.wie && n.wie !== rol ? 'Klaar · naar ' + naam(n.wie).toLowerCase() : 'Verder'; v.className = 'verder'; v.dataset.doe = 'verder'; }
    else { v.textContent = 'Opnieuw'; v.className = 'verder zacht'; v.dataset.doe = 'opnieuw'; }
    if (laad) app.src = 'app.html#/' + scherm();
  }
  function naar(f, r){ fase = f; if (r) rol = r; zet('upk-reis-fase', String(fase)); zet('upk-reis-rol', rol); teken(true); }

  document.getElementById('rollen').addEventListener('click', e => { const b = e.target.closest('[data-rol]'); if (b) naar(fase, b.dataset.rol); });
  document.getElementById('verder').addEventListener('click', e => {
    const d = e.currentTarget.dataset.doe;
    if (d === 'kijk') naar(fase, F[fase].wie);
    else if (d === 'verder') { const n = F[fase + 1]; naar(fase + 1, n.wie || rol); }
    else opnieuw();
  });
  function opnieuw(){ try { localStorage.removeItem('upk-lid'); } catch (e) {} naar(0, 'klant'); }
  document.getElementById('opnieuw').addEventListener('click', opnieuw);
  document.getElementById('reisknop').addEventListener('click', () => {
    const rij = F.map((f, i) => '<button class="stap ' + (i < fase ? 'af' : i === fase ? 'nu' : '') + '" type="button" data-f="' + i + '"><i>' + (i < fase ? '✓' : i + 1) + '</i><span><small>' + (f.wie ? naam(f.wie).toUpperCase() : 'IEDEREEN') + '</small>' + f.wat + '</span></button>').join('');
    const b = document.getElementById('blad');
    b.innerHTML = '<div class="blad" id="bladbg"><div role="dialog" aria-label="De hele reis"><h2>De hele reis</h2>' + rij + '<button class="sluit" type="button" id="sluit">Sluiten</button></div></div>';
    b.querySelector('#bladbg').addEventListener('click', ev => {
      const s = ev.target.closest('[data-f]');
      if (s) { b.innerHTML = ''; const i = +s.dataset.f; naar(i, F[i].wie || rol); return; }
      if (ev.target.id === 'sluit' || ev.target.id === 'bladbg') b.innerHTML = '';
    });
  });
  teken(true);
})();
</script>
</body>
</html>
