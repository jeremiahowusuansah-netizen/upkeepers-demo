<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body><title>UPKeepers Klantreis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Nunito+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: één telefoonkolom, rolwissel bovenaan, de klus loopt door drie rollen. Bewust één thema: zand en crème van UPKeepers. */
:root{
  --zand:#ECE5D7; --creme:#F7F3EB; --inkt:#0A341E; --groen:#2F5D45; --goud:#CBA45C; --fout:#8A2E1F;
  --gedempt:rgba(10,52,30,0.64); --lijn:rgba(10,52,30,0.12); --wit:#FFFFFF;
  --kop:'Montserrat',system-ui,sans-serif; --tekst:'Nunito Sans',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--zand);color:var(--inkt);font-family:var(--tekst);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--goud);outline-offset:2px}
.app{max-width:430px;margin:0 auto;padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}
.balk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--zand);padding-block:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--zand)}
.rollen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:999px;background:var(--creme);border:1px solid var(--lijn)}
.rol{position:relative;min-height:40px;border:0;border-radius:999px;background:transparent;font-size:15px}
.rol[aria-selected="true"]{background:var(--inkt);color:var(--creme)}
.rol .stip{position:absolute;top:7px;right:12px;width:7px;height:7px;border-radius:999px;background:var(--goud)}
.zet{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--gedempt);padding:0 6px}
.zet b{font-weight:600;color:var(--inkt)}
.link{border:0;background:transparent;padding:6px 0;font-size:13px;color:var(--gedempt);text-decoration:underline;text-underline-offset:3px}
.lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gedempt)}
h1{margin:0;font-family:var(--kop);font-weight:300;font-size:34px;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-family:var(--kop);font-weight:300;font-size:24px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.zacht{color:var(--gedempt);font-weight:300}
.kop{display:flex;flex-direction:column;gap:8px;padding:8px 8px 0}
.kaart{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:22px;background:var(--creme);border:1px solid var(--lijn)}
.kaart.goud{border-color:rgba(203,164,92,.6)}
.kaart.donker{background:var(--inkt);color:var(--creme);border:0}
.kaart.donker .lbl{color:rgba(247,243,235,.7)}
.knop{min-height:52px;border:0;border-radius:999px;background:var(--inkt);color:var(--creme);font-size:17px;padding:0 20px}
.knop:disabled{opacity:.35;cursor:not-allowed}
.knop2{min-height:52px;border-radius:999px;background:transparent;border:1px solid rgba(10,52,30,.18);font-size:17px;padding:0 20px}
.knoppen{display:grid;gap:8px}
.twee{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(10,52,30,.18);background:var(--creme);font-size:15px}
.chip[aria-pressed="true"]{background:var(--inkt);color:var(--creme);border-color:var(--inkt)}
.raster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tegel{min-height:76px;border-radius:18px;border:1px solid var(--lijn);background:var(--creme);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px}
.tegel[aria-pressed="true"]{border-color:var(--inkt);box-shadow:inset 0 0 0 1px var(--inkt)}
.tegel svg{width:24px;height:24px}
.rij{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--lijn)}
.rij:last-child{border-bottom:0}
.rij span:first-child{color:var(--gedempt);font-size:14px}
.rij span:last-child{text-align:right;min-width:0}
.veld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--gedempt)}
.veld input,.veld textarea{min-height:50px;border-radius:14px;border:1px solid rgba(10,52,30,.18);background:var(--wit);padding:12px 14px;font-size:17px;color:var(--inkt)}
.veld textarea{resize:none}
.vink{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.vink input{width:22px;height:22px;margin-top:1px;accent-color:var(--inkt);flex:0 0 auto}
.bericht{padding:12px 14px;border-radius:16px;background:var(--inkt);color:var(--creme);display:flex;flex-direction:column;gap:2px}
.bericht small{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;color:rgba(247,243,235,.7)}
.ok{padding:14px 16px;border-radius:16px;background:rgba(47,93,69,.12);font-size:16px}
.voortgang{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.voortgang span{height:2px;background:var(--lijn)}
.voortgang span.aan{background:var(--inkt)}
.voortgang span.nu{background:var(--goud)}
.vlabels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12px;color:var(--gedempt)}
.tl{display:flex;flex-direction:column}
.tl-r{display:grid;grid-template-columns:20px 1fr;column-gap:12px}
.tl-s{width:11px;height:11px;border-radius:999px;margin:6px 0 0 4px;background:var(--inkt)}
.tl-s.open{background:transparent;border:1px solid rgba(10,52,30,.4)}
.tl-s.nu{background:var(--goud)}
.tl-l{width:1px;min-height:16px;margin-left:9px;background-image:linear-gradient(rgba(10,52,30,.3) 50%,transparent 0);background-size:1px 5px}
.tl-t{display:flex;flex-direction:column;gap:1px;padding-bottom:2px}
.tl-t small{font-size:12px;color:var(--gedempt)}
.foto{height:120px;border-radius:16px;background:linear-gradient(160deg,#1B4A31 0%,#0C2A19 100%);position:relative;overflow:hidden}
.foto span{position:absolute;left:10px;bottom:10px;font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(247,243,235,.94);color:var(--inkt)}
.foto img{width:100%;height:100%;object-fit:cover}
.vk{display:flex;gap:12px;align-items:center}
.av{flex:0 0 auto;width:46px;height:46px;border-radius:999px;background:linear-gradient(160deg,#2A5B40,#123522);border:1px solid rgba(203,164,92,.6);display:flex;align-items:center;justify-content:center;font-family:var(--kop);font-weight:300;font-size:19px;color:var(--creme)}
.keus{width:28px;height:28px;border-radius:999px;border:1px solid rgba(10,52,30,.3);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.keus.aan{background:var(--inkt);color:var(--creme);border-color:var(--inkt)}
.vkr{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border-radius:16px;border:1px solid var(--lijn);background:var(--creme);text-align:left}
.vkr div{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.vkr small{font-size:13px;color:var(--gedempt)}
.spoed{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;border:1px solid rgba(10,52,30,.14)}
.rood{border:2px solid var(--fout);color:var(--fout);border-radius:14px;min-height:48px;display:flex;align-items:center;justify-content:center;font-weight:600}
.blad{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,52,30,.32)}
.blad>div{width:100%;max-width:460px;max-height:86%;overflow-y:auto;background:var(--creme);border-radius:26px 26px 0 0;padding:16px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.greep{align-self:center;width:40px;height:4px;border-radius:999px;background:rgba(10,52,30,.18)}
.reisstap{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--lijn);font-size:15px}
.reisstap:last-child{border-bottom:0}
.reisstap i{font-style:normal;width:22px;height:22px;flex:0 0 auto;border-radius:999px;border:1px solid rgba(10,52,30,.3);display:flex;align-items:center;justify-content:center;font-size:12px}
.reisstap.af i{background:var(--inkt);color:var(--creme);border-color:var(--inkt)}
.reisstap.nu i{background:var(--goud);border-color:var(--goud);color:var(--inkt)}
.reisstap small{display:block;color:var(--gedempt);font-size:13px}
.sync{font-size:12px;color:var(--gedempt);text-align:center}
@keyframes op{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.scherm{display:flex;flex-direction:column;gap:14px;animation:op 500ms cubic-bezier(.22,.61,.36,1) both}
@media (prefers-reduced-motion:reduce){.scherm{animation:none}}
.verborgen{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="app">
  <div class="balk">
    <div class="rollen" role="tablist" aria-label="Rol" id="rollen"></div>
    <div class="zet"><span id="zet"></span><span style="display:flex;gap:14px"><button class="link" data-act="reis">Jouw reis</button><button class="link" data-act="opnieuw">Opnieuw</button></span></div>
  </div>
  <main id="scherm"></main>
  <p class="sync" id="sync">Voorbeeldgegevens · niets wordt echt verstuurd of betaald</p>
</div>
<div id="blad"></div>

<script>
(function(){
// ---------- Vaste gegevens van de demo (voorbeelden) ----------
const KLANT = { naam:'Sanne', achternaam:'de Vries', adres:'Kastanjelaan 14', plaats:'Hilversum', postcode:'1213 AB', huis:'14', woning:'Tussenwoning, 1932, 142 m²', tel:'06 •• •• 41 27' };
const VAKMANNEN = [
  { id:'ahmed', naam:'Ahmed B.', vak:'Loodgieter · 14 jaar', score:'4,9 uit 38 klussen', past:'Kan do 30 okt ochtend en vr 31 okt' },
  { id:'kees', naam:'Kees V.', vak:'Loodgieter · 9 jaar', score:'4,6 uit 51 klussen', past:'Kan wo 29 okt middag', signaal:'Signaal: twee keer later dan het tijdvak' },
  { id:'youssef', naam:'Youssef A.', vak:'Allround · in opbouw', score:'4,8 uit 6 klussen', past:'Kan do 30 okt middag' }
];
const MOMENTEN = [
  { id:'wo-m', dag:'Wo 29 okt', deel:'Middag', tijd:'13:00–15:00' },
  { id:'do-o', dag:'Do 30 okt', deel:'Ochtend', tijd:'09:00–11:00' },
  { id:'do-m', dag:'Do 30 okt', deel:'Middag', tijd:'13:00–15:00' },
  { id:'vr-o', dag:'Vr 31 okt', deel:'Ochtend', tijd:'09:00–11:00' },
  { id:'ma-o', dag:'Ma 3 nov', deel:'Ochtend', tijd:'09:00–11:00' },
  { id:'di-m', dag:'Di 4 nov', deel:'Middag', tijd:'13:00–15:00' }
];
const PRIJZEN = [
  { id:'v95', tekst:'€ 95,00', soort:'Vaste prijs', vakman:'€ 70,00' },
  { id:'b95', tekst:'€ 95 tot € 145', soort:'Bandbreedte', vakman:'€ 70 tot € 110' },
  { id:'b145', tekst:'€ 145 tot € 195', soort:'Bandbreedte', vakman:'€ 110 tot € 150' }
];
const RUIMTES = {
  Keuken:['Kraan','Afvoer','Afzuigkap','Stopcontact'], Badkamer:['Kraan','Douche','Toilet','Kitnaden'],
  Woonkamer:['Radiator','Kozijn','Stopcontact','Vloer'], Slaapkamer:['Radiator','Kozijn','Stopcontact','Plafond'],
  Zolder:['Cv-ketel','Dakraam','Isolatie','Leiding'], Buiten:['Dakgoot','Dak','Gevel','Schutting']
};
const ICONEN = {
  Keuken:'<path d="M4 10h16v10H4zM8 10V4h8v6M9 14h6"/>', Badkamer:'<path d="M4 12h16v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM7 12V6a2 2 0 0 1 4 0"/>',
  Woonkamer:'<path d="M4 18v-6a3 3 0 0 1 6 0h4a3 3 0 0 1 6 0v6zM4 18v2M20 18v2"/>', Slaapkamer:'<path d="M3 18V8M3 14h18v4M21 18V12a3 3 0 0 0-3-3H10v5"/>',
  Zolder:'<path d="M3 20L12 5l9 15zM9 20v-5h6v5"/>', Buiten:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/>'
};
const ROLLEN = [ { id:'klant', naam:'Klant' }, { id:'admin', naam:'Klantenservice' }, { id:'vakman', naam:'Vakman' } ];

// Wie is aan zet, per fase, en wat die moet doen.
const AANZET = {
  nieuw:['klant','meld je aan'], lid:['klant','meld een klus'], gemeld:['admin','kies prijs en vakmannen'],
  aangeboden:['vakman','neem de opdracht aan'], aangenomen:['klant','ga akkoord met tijd en prijs'],
  gepland:['vakman','de dag van de klus'], later:['klant','kies je nieuwe tijd'], onderweg:['vakman','start de klus'],
  bezig:['vakman','werk en lever op'], vondst:['klant','beslis over de vondst'], opgeleverd:['klant','keur het werk goed'],
  klopt:['admin','bel Sanne en los het op'], goedgekeurd:[null,'de reis is rond']
};

// De reis per rol, voor het blad "Jouw reis".
const REIS = {
  klant:[ ['Aanmelden','Postcode, woning, over jou, lidmaatschap',['nieuw']], ['Welkom','Wat we al van je huis weten',['nieuw']],
    ['Klus melden','Ruimte, wat er is, drie momenten',['lid']], ['Wachten','Binnen één werkdag weet je wie, wanneer en wat het kost',['gemeld','aangeboden']],
    ['Tijd en prijs akkoord','Vóór er iemand komt',['aangenomen']], ['Bericht bij uitloop','Altijd vóór je tijdvak, met een nieuwe tijd',['later']],
    ['De vakman komt','Onderweg, aan het werk',['gepland','onderweg','bezig']], ['Een vondst?','Altijd met een voorstel en een prijs',['vondst']],
    ['Goedkeuren','Foto’s van voor en na',['opgeleverd','klopt']], ['Dossier bijgewerkt','Van aandacht naar goed',['goedgekeurd']] ],
  admin:[ ['Nieuw lid','Komt vanzelf binnen',['nieuw']], ['Melding beoordelen','Wat is het, wat kost het',['lid','gemeld']],
    ['Drie vakmannen op volgorde','Daarna loopt het vanzelf',['gemeld']], ['Aanbod en akkoord','Loopt vanzelf; jij kijkt mee',['aangeboden','aangenomen']],
    ['Uitloop','Nieuwe tijd staat vanzelf klaar',['later']], ['Klant aan de telefoon','Alles van Sanne op één scherm',[]],
    ['Iets klopt niet','Bellen, samen oplossen',['klopt']], ['Uitbetaling','Pas na goedkeuring',['goedgekeurd']] ],
  vakman:[ ['Nieuwe opdracht','Plaats, wat er gezien is, vergoeding',['aangeboden']], ['Aannemen','Kies een moment van de klant',['aangeboden']],
    ['De dag van de klus','Op tijd, of uitloop melden vóór het tijdvak',['aangenomen','gepland','later']], ['Onderweg en aan het werk','',['onderweg']],
    ['Vondst melden','Met voorstel, duur en prijs',['bezig','vondst']], ['Opleveren','Foto’s, wat je deed',['bezig']],
    ['Betaling','Na goedkeuring van de klant',['opgeleverd','klopt','goedgekeurd']] ]
};
const VOLGORDE = ['nieuw','lid','gemeld','aangeboden','aangenomen','gepland','later','onderweg','bezig','vondst','opgeleverd','klopt','goedgekeurd'];

function begin(){ return { fase:'nieuw', rev:0, lid:null, melding:null, prijs:null, keuzes:[], idx:0, moment:null, later:null, vondst:null, oplevering:null, klopt:null, log:[] }; }

// ---------- Opslag: gedeeld via db, anders alleen op dit toestel ----------
let S = begin();
let db = null, ref = null;
const KEY = 'upk-reis-v1';
try { const r = localStorage.getItem(KEY); if (r) S = JSON.parse(r); } catch(e){}
const L = { rol:'klant', stap:0, welkom:0, mstap:0, ruimte:null, element:null, wat:null, tekst:'De kraan druppelt ook als hij dicht is.', foto:null, spoed:false, gekozen:[], prijs:null, keuzes:[], vmoment:null, weiger:false, uit:null, ander:false, vtekst:'Kraanpatroon vervangen en de kraan opnieuw vastgezet. Lekt niet meer.', reden:null, ftab:'te-doen', naam:'Sanne de Vries', tel:'06 12 34 41 27', av:false, plan:null, vondstOpen:false };
try { const r = localStorage.getItem(KEY+'-rol'); if (r) L.rol = r; } catch(e){}

function bewaar(){
  S.rev = (S.rev||0) + 1;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (ref) ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{});
  teken();
}
function log(wie, tijd, tekst){ S.log = (S.log||[]).concat([{ wie, tijd, tekst }]); }
function zet(fase){ S.fase = fase; }

(async function(){
  try {
    db = window.claude && await window.claude.use('db');
    if (!db) return;
    ref = db.doc('reis/klus');
    ref.onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); if ((d.rev||0) >= (S.rev||0)) { S = JSON.parse(JSON.stringify(d)); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} teken(); } }
      else ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{});
      document.getElementById('sync').textContent = 'Gedeeld: open deze pagina op een tweede telefoon en speel een andere rol · voorbeeldgegevens, niets wordt echt verstuurd of betaald';
    }, () => {});
  } catch(e){}
})();

// ---------- Hulpjes ----------
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vm = () => VAKMANNEN.find(v => v.id === (S.keuzes||[])[S.idx||0]) || VAKMANNEN[0];
const vnaam = () => vm().naam.split(' ')[0];
const mom = id => MOMENTEN.find(m => m.id === id);
const prijs = () => PRIJZEN.find(p => p.id === S.prijs) || PRIJZEN[1];
const tijdvak = () => S.later && S.later.nieuw ? S.later.nieuw : (S.moment ? mom(S.moment).dag + ', ' + mom(S.moment).tijd : '');
const ico = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">' + (ICONEN[n]||ICONEN.Buiten) + '</svg>';
const bericht = (soort, tijd, tekst) => '<div class="bericht" role="status"><small><span>UPKEEPERS · ' + soort + '</span><span>' + tijd + '</span></small><span>' + tekst + '</span></div>';
const voortgang = (nu) => { const n=['Bevestigd','Onderweg','Gestart','Afgerond']; return '<div class="voortgang">' + n.map((x,i)=>'<span class="'+(i<nu?'aan':i===nu?'nu':'')+'"></span>').join('') + '</div><div class="vlabels">' + n.map((x,i)=>'<span style="'+(i===nu?'color:var(--inkt)':'')+'">'+x+'</span>').join('') + '</div>'; };
const wachten = (wie, wat) => '<div class="kaart"><span class="lbl">Niets te doen</span><p>' + wat + '</p><button class="knop2" data-act="rol" data-v="' + wie + '">Kijk mee als ' + ROLLEN.find(r=>r.id===wie).naam.toLowerCase() + '</button></div>';
const kop = (lbl, titel, sub) => '<div class="kop">' + (lbl?'<span class="lbl">'+lbl+'</span>':'') + '<h1>' + titel + '</h1>' + (sub?'<p class="zacht">'+sub+'</p>':'') + '</div>';
const tl = rijen => '<div class="tl">' + rijen.map((r,i)=>(i?'<div class="tl-r"><span class="tl-l"></span><span></span></div>':'') + '<div class="tl-r"><span class="tl-s '+(r[2]||'')+'"></span><span class="tl-t"><span>'+r[0]+'</span><small>'+r[1]+'</small></span></div>').join('') + '</div>';
const ix = f => VOLGORDE.indexOf(f);
const voorbij = f => ix(S.fase) > ix(f);

// ---------- KLANT ----------
function klant(){
  const f = S.fase;
  if (f === 'nieuw') return aanmelden();
  if (f === 'lid' && L.mstap > 0) return melden();
  let h = '';
  const k = '<div class="kop"><span class="lbl">' + KLANT.adres + ' · ' + KLANT.plaats + '</span><h1>Goedemorgen, ' + esc((L.naam||'Sanne').split(' ')[0]) + '</h1><p class="zacht">' + (f==='goedgekeurd' ? 'Je keuken is weer goed.' : 'Je huis is in goede staat.') + '</p></div>';
  if (f === 'lid') {
    return k + '<div class="kaart goud"><span class="lbl">Klaar om te beginnen</span><h2>Is er iets dat aandacht vraagt?</h2><p class="zacht">Meld het met een foto. Kost het iets, dan zie je eerst de prijs en beslis jij.</p><button class="knop" data-act="melden">Meld een klus</button></div>'

function teken(){
  const az = AANZET[S.fase] || [null,''];
  document.getElementById('rollen').innerHTML = ROLLEN.map(r => '<button class="rol" role="tab" data-act="rol" data-v="' + r.id + '" aria-selected="' + (L.rol===r.id) + '">' + r.naam + (az[0]===r.id && L.rol!==r.id ? '<span class="stip" aria-label="aan zet"></span>' : '') + '</button>').join('');
  document.getElementById('zet').innerHTML = az[0] ? 'Aan zet: <b>' + ROLLEN.find(r=>r.id===az[0]).naam + '</b> · ' + az[1] : '<b>Rond</b> · ' + az[1];
  const el = document.getElementById('scherm');
  el.innerHTML = L.rol === 'klant' ? '<div class="scherm">' + klant() + '</div>' : L.rol === 'admin' ? admin() : vakman();
  const fi = document.getElementById('fotoin');
  if (fi) fi.addEventListener('change', e => { const file = e.target.files && e.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { L.foto = r.result; teken(); }; r.readAsDataURL(file); });
  const av = document.getElementById('av'); if (av) av.addEventListener('change', e => { L.av = e.target.checked; leesVelden(); teken(); });
}
function leesVelden(){
  const v = id => { const e = document.getElementById(id); return e ? e.value : null; };
  if (v('nm') !== null) L.naam = v('nm');
  if (v('tl') !== null) L.tel = v('tl');
  if (v('tx') !== null) L.tekst = v('tx');
  if (v('vt') !== null) L.vtekst = v('vt');
}
function reisBlad(){
  const rol = L.rol, i = ix(S.fase);
  const stappen = REIS[rol];
  let nuGezet = false;
  const rijen = stappen.map((s,n) => {
    const fasen = s[2];
    const nu = fasen.includes(S.fase);
    const af = !nu && fasen.length && fasen.every(f => ix(f) < i) ;
    let cls = nu && !nuGezet ? 'nu' : af ? 'af' : '';
    if (cls==='nu') nuGezet = true;
    return '<div class="reisstap ' + cls + '"><i>' + (cls==='af'?'✓':n+1) + '</i><span>' + s[0] + (s[1]?'<small>'+s[1]+'</small>':'') + '</span></div>';
  }).join('');
  return '<div class="blad" data-act="sluit"><div role="dialog" aria-label="Jouw reis" data-stop="1"><span class="greep"></span><span class="lbl">De reis van de ' + ROLLEN.find(r=>r.id===rol).naam.toLowerCase() + '</span><div>' + rijen + '</div><button class="knop2" data-act="sluit">Sluiten</button></div></div>';
}

  'k-vondst-later': () => { S.vondst.status = 'later'; zet('bezig'); log('klant', tijdvak().split(',')[0] + ', 10:52','Sanne plant de sifon later in'); bewaar(); return 'stil'; },
  'v-oplever': () => { leesVelden(); S.oplevering = L.vtekst; zet('opgeleverd'); log('vakman', tijdvak().split(',')[0] + ', 11:35', vm().naam + ' leverde op met foto’s'); bewaar(); return 'stil'; },
  'k-goed': () => { zet('goedgekeurd'); log('klant', tijdvak().split(',')[0] + ', 11:48','Sanne keurde het werk goed; uitbetaling aan ' + vm().naam + ' staat klaar'); bewaar(); return 'stil'; },
  'k-klopt-open': () => { L.reden = 'open'; },
  'k-klopt-terug': () => { L.reden = null; },
  'k-klopt': v => { S.klopt = v; L.reden = null; zet('klopt'); log('klant', tijdvak().split(',')[0] + ', 11:50','Sanne meldde: ' + v.toLowerCase()); bewaar(); return 'stil'; }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'sluit' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  leesVelden();
  const r = doe[b.dataset.act] && doe[b.dataset.act](b.dataset.v);
  if (r !== 'stil') teken();
});
teken();
})();
</script>
