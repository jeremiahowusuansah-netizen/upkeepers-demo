<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><style>*{animation:none!important;transition:none!important}</style></head><body style="margin:0;background:#ECE5D7">

<style>

    <span style="font-size: 11px; letter-spacing: 0.22em; color: rgba(10,52,30,0.62)">STAP 2 VAN 5</span>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>

      <div class="op" style="display: flex; flex-direction: column; gap: 26px">

            <button type="button" style="min-height: 120px; padding: 14px; border-radius: 18px; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 6px; text-align: left; transition: background 400ms, color 400ms; background: #F7F3EB; color: #0A341E; border: 1px solid rgba(10,52,30,0.1)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg><span style="font-size: 15px">Weet ik niet</span><span style="font-size: 12px; line-height: 1.35; opacity: 0.72">Maak een foto, wij kijken mee</span></button>
          
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: rgba(10,52,30,0.62)">Je hoeft niet te weten welke vakman er nodig is. Dat zoeken wij uit.</p>
      </div>
    

    

    

    
  </div>

  <div style="flex: 0 0 auto; padding: 12px 20px 30px">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 10px 14px; border-radius: 16px; background: #F7F3EB; border: 1px solid rgba(10,52,30,0.08); font-size: 13px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #CBA45C; flex: 0 0 auto"></span><span>Badkamer</span></div>
    
      <button type="button" style="width: 100%; min-height: 56px; border: 0; border-radius: 999px; background: #0A341E; color: #F7F3EB; font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 16px; cursor: pointer">Verder</button>
