<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><style>*{animation:none!important;transition:none!important}</style></head><body style="margin:0;background:#ECE5D7">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&amp;family=Nunito+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A341E}a:hover{color:#14492c}
.op{animation:op 700ms cubic-bezier(.22,.61,.36,1) both}
@keyframes op{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.huis{animation:huis 1400ms cubic-bezier(.22,.61,.36,1) both}
@keyframes huis{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.op,.huis{animation:none}}
.lbl{font-size:10px;letter-spacing:0.22em;color:rgba(10,52,30,0.62)}
.knop{min-height:56px;border:0;border-radius:999px;background:#0A341E;color:#F7F3EB;font-family:'Montserrat',sans-serif;font-weight:500;font-size:16px;cursor:pointer;transition:transform 120ms,background 200ms}
.knop:hover{background:#14492c}.knop:active{transform:scale(.98)}.knop:focus-visible{outline:2px solid #CBA45C;outline-offset:3px}
.knop2{min-height:56px;border-radius:999px;background:#F7F3EB;border:1px solid rgba(10,52,30,0.14);color:#0A341E;font-family:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 120ms}
.knop2:active{transform:scale(.98)}.knop2:focus-visible{outline:2px solid #CBA45C;outline-offset:3px}
.veld{display:flex;flex-direction:column;gap:6px}
.veld span{font-size:13px;color:rgba(10,52,30,0.72)}
.veld input{min-height:52px;border-radius:16px;border:1px solid rgba(10,52,30,0.16);background:#F7F3EB;padding:0 16px;font-family:inherit;font-size:16px;color:#0A341E;outline:none}
.veld input:focus{border-color:#0A341E}
</style>

<div style="width: 390px; max-width: 100%; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; position: relative; overflow: hidden; color: #0A341E; font-family: 'Nunito Sans', system-ui, sans-serif; background: #ECE5D7">

  
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 30px 24px 34px; box-sizing: border-box">
      <span style="font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.34em">UPKEEPERS</span>
      <span style="margin-top: 6px; font-size: 12px; letter-spacing: 0.06em; color: rgba(10,52,30,0.62)">jouw woningassistent</span>
      <svg class="huis" width="260" height="244" viewBox="0 0 320 300" fill="none" aria-hidden="true" style="margin-top: 70px">
        <defs>
          <linearGradient id="voor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A5B40"/><stop offset="1" stop-color="#123522"/></linearGradient>
          <linearGradient id="zij" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F2C1C"/><stop offset="1" stop-color="#0A2114"/></linearGradient>
          <linearGradient id="dakR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26362C"/><stop offset="1" stop-color="#141F18"/></linearGradient>
          <linearGradient id="raam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3B4"/><stop offset="1" stop-color="#CBA45C"/></linearGradient>
          <filter id="schaduw" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
        </defs>
        <ellipse cx="165" cy="292" rx="150" ry="26" fill="#0A341E" opacity=".28" filter="url(#schaduw)"/>
        <polygon points="60,150 115,105 205,60 150,105" fill="#141F18"/>
        <polygon points="60,250 60,150 115,105 170,200 170,300" fill="url(#voor)"/>
        <polygon points="170,200 260,155 260,255 170,300" fill="url(#zij)"/>
        <polygon points="115,105 170,200 260,155 205,60" fill="url(#dakR)"/>
        <path d="M115 105L205 60" stroke="#CBA45C" stroke-width="1.2"/>
        <polygon points="75,182 103,195 103,229 75,216" fill="url(#raam)"/>
        <polygon points="127,206 155,218 155,252 127,240" fill="url(#raam)"/>
        <polygon points="190,200 220,185 220,219 190,234" fill="url(#raam)"/>
        <polygon points="232,199 250,190 250,258 232,267" fill="#071A0F"/>
      </svg>
      <h1 class="op" style="margin: 34px 0 0; font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 32px; line-height: 1.12; letter-spacing: -0.02em; text-align: center">Weet wat je huis nodig heeft,<br>en wanneer.</h1>
      <span class="op" style="margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(10,52,30,0.72)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Nu in Amsterdam, Amstelveen en 't Gooi</span>
      <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
        <button type="button" class="knop">Begin met je woning</button>
        <button type="button" class="knop2">Ik heb al een account</button>
      </div>
    </div>
  

  

  

  

  

  
</div>
</body></html>
