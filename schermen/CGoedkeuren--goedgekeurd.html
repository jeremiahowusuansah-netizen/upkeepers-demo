body{margin:0}
a{color:#0A341E}a:hover{color:#14492c}
.op{animation:op 900ms cubic-bezier(.22,.61,.36,1) both}
.op2{animation:op 900ms 200ms cubic-bezier(.22,.61,.36,1) both}
.op3{animation:op 900ms 400ms cubic-bezier(.22,.61,.36,1) both}
.huis{animation:huis 1400ms cubic-bezier(.22,.61,.36,1) both}
.aan{animation:aan 1600ms 300ms cubic-bezier(.22,.61,.36,1) both}
@keyframes op{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes huis{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes aan{from{opacity:.15}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.op,.op2,.op3,.huis,.aan{animation:none}}
.lbl{font-size:10px;letter-spacing:0.22em;color:rgba(10,52,30,0.62)}
</style>
