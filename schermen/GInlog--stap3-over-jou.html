<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><style>*{animation:none!important;transition:none!important}</style></head><body style="margin:0;background:#ECE5D7">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&amp;family=Nunito+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A341E}a:hover{color:#14492c}
.op{animation:op 700ms cubic-bezier(.22,.61,.36,1) both}
@keyframes op{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.huis{animation:huis 1400ms cubic-bezier(.22,.61,.36,1) both}
@keyframes huis{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.op,.huis{animation:none}}
.lbl{font-size:10px;letter-spacing:0.22em;color:rgba(10,52,30,0.62)}
.knop{min-height:56px;border:0;border-radius:999px;background:#0A341E;color:#F7F3EB;font-family:'Montserrat',sans-serif;font-weight:500;font-size:16px;cursor:pointer;transition:transform 120ms,background 200ms}
.knop:hover{background:#14492c}.knop:active{transform:scale(.98)}.knop:focus-visible{outline:2px solid #CBA45C;outline-offset:3px}
.knop2{min-height:56px;border-radius:999px;background:#F7F3EB;border:1px solid rgba(10,52,30,0.14);color:#0A341E;font-family:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 120ms}
.knop2:active{transform:scale(.98)}.knop2:focus-visible{outline:2px solid #CBA45C;outline-offset:3px}
.veld{display:flex;flex-direction:column;gap:6px}
.veld span{font-size:13px;color:rgba(10,52,30,0.72)}
.veld input{min-height:52px;border-radius:16px;border:1px solid rgba(10,52,30,0.16);background:#F7F3EB;padding:0 16px;font-family:inherit;font-size:16px;color:#0A341E;outline:none}
.veld input:focus{border-color:#0A341E}
</style>

<div style="width: 390px; max-width: 100%; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; position: relative; overflow: hidden; color: #0A341E; font-family: 'Nunito Sans', system-ui, sans-serif; background: #ECE5D7">

  

  

  
    <div class="op" style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 24px 24px 34px; box-sizing: border-box; gap: 16px; overflow-y: auto">
      <span class="lbl">STAP 2 VAN 4 · OVER JOU</span>
      <h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 32px; line-height: 1.12; letter-spacing: -0.02em">Wie ben je?</h1>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" class="knop2" style="min-height: 48px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.9-.9-3.1-.8C6.8 7.3 5.3 8.2 4.5 9.6c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.4 3 2.4 1.2 0 1.6-.8 3.1-.8s1.8.8 3.1.8 2.1-1.2 2.9-2.3c.9-1.3 1.3-2.6 1.3-2.7 0 0-2.6-1-2.7-4zM14.1 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.4-.6.7-1.1 1.8-1 2.9 1.1.1 2.1-.5 2.8-1.3z"/></svg>Met Apple</button>
        <button type="button" class="knop2" style="min-height: 48px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 12.2c0-.6-.1-1.2-.2-1.7H12v3.3h4.5a3.9 3.9 0 0 1-1.7 2.5v2h2.7c1.6-1.4 2.5-3.6 2.5-6.1z"/><path d="M12 20c2.3 0 4.2-.8 5.5-2.1l-2.7-2c-.7.5-1.7.8-2.8.8-2.2 0-4-1.5-4.6-3.4H4.6v2.1A8 8 0 0 0 12 20z"/><path d="M7.4 13.3a4.8 4.8 0 0 1 0-3V8.2H4.6a8 8 0 0 0 0 7.2z"/><path d="M12 6.6c1.2 0 2.3.4 3.2 1.2l2.4-2.4A8 8 0 0 0 4.6 8.2l2.8 2.1C8 8.1 9.8 6.6 12 6.6z"/></svg>Met Google</button>
      </div>
      <label class="veld"><span>Naam</span><input value="Sanne de Vries" autocomplete="name"></label>
      <label class="veld"><span>Telefoonnummer</span><input value="06 12 34 56 78" type="tel" autocomplete="tel" inputmode="tel"></label>
      <span style="margin-top: -8px; font-size: 12px; line-height: 1.45; color: rgba(10,52,30,0.62)">Voor de afspraak: wij bellen als er iets verandert.</span>
      <label class="veld"><span>E-mailadres</span><input value="sanne@voorbeeld.nl" type="email" autocomplete="email"></label>
      <button type="button" role="checkbox" aria-checked="false" style="display: flex; gap: 12px; align-items: flex-start; padding: 0; border: 0; background: transparent; color: #0A341E; font-family: inherit; font-size: 13px; line-height: 1.5; text-align: left; cursor: pointer">
        <span style="flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; transition: background 200ms; background: #F7F3EB; border: 1.5px solid rgba(10,52,30,0.4)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F7F3EB" stroke-width="2.4" aria-hidden="true" style="opacity: 0"><path d="M5 12l5 5 9-10"/></svg></span>
        <span>Ik ga akkoord met de <a href="#" style="text-decoration: underline">Algemene Voorwaarden</a> en de <a href="#" style="text-decoration: underline">Privacyverklaring</a>.</span>
      </button>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
        <button type="button" style="width: 100%; min-height: 56px; border: 0; border-radius: 999px; font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 16px; transition: background 200ms; background: rgba(10,52,30,0.12); color: rgba(10,52,30,0.5); cursor: default">Stuur mijn code</button>
        <span style="text-align: center; font-size: 12px; color: rgba(10,52,30,0.62)">Geen wachtwoord nodig. Je krijgt een code van vier cijfers.</span>
      </div>
    </div>
  

  

  

  
    <button type="button" aria-label="Vorige stap" style="position: absolute; top: 14px; right: 16px; width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(10,52,30,0.12); background: #F7F3EB; color: #0A341E; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  
</div>
</body></html>
