<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><style>*{animation:none!important;transition:none!important}</style></head><body style="margin:0;background:#ECE5D7">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&amp;family=Nunito+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A341E}a:hover{color:#14492c}
.lbl{font-size:10px;letter-spacing:0.22em;color:rgba(10,52,30,0.62)}
.sk{background:linear-gradient(90deg,#E2DACB 0%,#EFE8DA 50%,#E2DACB 100%);background-size:200% 100%;animation:sk 1600ms ease-in-out infinite;border-radius:10px}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
.loop{position:relative;overflow:hidden;height:2px;background:rgba(10,52,30,0.12);border-radius:2px}
.loop::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:2px;background:#0A341E;animation:loop 1400ms cubic-bezier(.22,.61,.36,1) infinite}
@keyframes loop{to{left:100%}}
@media (prefers-reduced-motion:reduce){.sk,.loop::after{animation:none}}
.knop{min-height:52px;border:0;border-radius:999px;background:#0A341E;color:#F7F3EB;font-family:'Montserrat',sans-serif;font-weight:500;font-size:15px;cursor:pointer}
.knop2{min-height:52px;border-radius:999px;background:#F7F3EB;border:1px solid rgba(10,52,30,0.14);color:#0A341E;font-family:inherit;font-size:14px;cursor:pointer}
</style>

<div style="width: 390px; max-width: 100%; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; position: relative; overflow: hidden; color: #0A341E; font-family: 'Nunito Sans', system-ui, sans-serif; background: #ECE5D7">
  <div style="padding: 20px 16px 0">
    <div role="tablist" aria-label="Toestand" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #F7F3EB; border: 1px solid rgba(10,52,30,0.08)">
      
        <button type="button" role="tab" aria-selected="true" style="min-height: 40px; border-radius: 999px; border: 0; cursor: pointer; font-family: inherit; font-size: 13px; transition: background 300ms, color 300ms; background: #0A341E; color: #F7F3EB">Laden</button>
      
        <button type="button" role="tab" aria-selected="false" style="min-height: 40px; border-radius: 999px; border: 0; cursor: pointer; font-family: inherit; font-size: 13px; transition: background 300ms, color 300ms; background: transparent; color: #0A341E">Wachten</button>
      
        <button type="button" role="tab" aria-selected="false" style="min-height: 40px; border-radius: 999px; border: 0; cursor: pointer; font-family: inherit; font-size: 13px; transition: background 300ms, color 300ms; background: transparent; color: #0A341E">Fout</button>
      
        <button type="button" role="tab" aria-selected="false" style="min-height: 40px; border-radius: 999px; border: 0; cursor: pointer; font-family: inherit; font-size: 13px; transition: background 300ms, color 300ms; background: transparent; color: #0A341E">Leeg</button>
      
    </div>
  </div>

  
    <div style="padding: 26px 24px 0; display: flex; flex-direction: column; gap: 14px" aria-busy="true" aria-label="Je dossier wordt geladen">
      <span class="lbl">LADEN · HET DOSSIER</span>
      <span class="sk" style="width: 60%; height: 30px"></span>
      <span class="sk" style="width: 100%; height: 230px; border-radius: 22px"></span>
      <span class="sk" style="width: 100%; height: 130px; border-radius: 22px"></span>
      <span class="sk" style="width: 70%; height: 16px"></span>
      <span class="sk" style="width: 85%; height: 16px"></span>
      <span style="margin-top: 6px; font-size: 12px; color: rgba(10,52,30,0.62)">Het skelet heeft dezelfde vorm als het scherm dat komt, zodat er niets verspringt.</span>
    </div>
  

  

  

  
</div>
</body></html>
