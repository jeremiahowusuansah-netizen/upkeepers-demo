<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><style>*{animation:none!important;transition:none!important}</style></head><body style="margin:0;background:#ECE5D7">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&amp;family=Nunito+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A341E}a:hover{color:#14492c}
.op{animation:op 700ms cubic-bezier(.22,.61,.36,1) both}
@keyframes op{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.op{animation:none}}
</style>

<div style="width: 390px; max-width: 100%; height: 100dvh; max-height: 844px; margin: 0 auto; box-sizing: border-box; color: #0A341E; background: #ECE5D7; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 0 0 auto; padding: 16px 14px 0; display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Vorige stap" style="color: #0A341E; width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span style="font-size: 11px; letter-spacing: 0.22em; color: rgba(10,52,30,0.62)">STAP 3 VAN 5</span>
    <a href="CStart.html" aria-label="Sluiten" style="color: #0A341E; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>
  <div style="flex: 0 0 auto; margin: 4px 24px 0; height: 1px; background: #F7F3EB; position: relative">
    <span style="position: absolute; left: 0; top: -0.5px; height: 2px; background: #CBA45C; transition: width 560ms cubic-bezier(.22,.61,.36,1); width: 60%"></span>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 30px 24px 16px">
    

    

    
      <div class="op" style="display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 11px; letter-spacing: 0.22em; color: rgba(10,52,30,0.62)">BADKAMER · KRAAN</span>
          <h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 32px; line-height: 1.12; letter-spacing: -0.02em; color: #0A341E">Laat zien wat er is</h1>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="min-height: 84px; border-radius: 18px; border: 1px solid rgba(10,52,30,0.1); background: #F7F3EB; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #0A341E; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button>
          <button type="button" style="min-height: 84px; border-radius: 18px; border: 1px solid rgba(10,52,30,0.1); background: #F7F3EB; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #0A341E; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>Video</button>
          <button type="button" style="min-height: 84px; border-radius: 18px; border: 1px solid rgba(10,52,30,0.1); background: #F7F3EB; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #0A341E; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Geluid</button>
          <button type="button" style="min-height: 84px; border-radius: 18px; border: 1px solid #0A341E; background: #F7F3EB; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #0A341E; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Tekst</button>
        </div>
        <div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: #F7F3EB; border: 1px solid rgba(10,52,30,0.08)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg>
          <span style="font-size: 13px; line-height: 1.45"><strong style="font-weight: 600">Tikt, zoemt of piept er iets?</strong> Neem het geluid op. Een vakman herkent veel aan het geluid, ook van een cv-ketel of leiding.</span>
        </div>
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; color: rgba(10,52,30,0.62)">In je eigen woorden</span>
          <textarea rows="4" style="border-radius: 18px; border: 1px solid rgba(10,52,30,0.1); background: #F7F3EB; padding: 14px 16px; font-family: inherit; font-size: 15px; line-height: 1.5; color: #0A341E; resize: none">De kraan blijft druppelen, ook als hij helemaal dicht is.</textarea>
        </label>
        <div style="border-top: 1px solid rgba(10,52,30,0.1); padding-top: 4px">
          <button type="button" aria-expanded="false" style="width: 100%; min-height: 48px; padding: 0; border: 0; background: transparent; color: #0A341E; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" style="flex: 0 0 auto"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>
            <span style="flex: 1 1 auto"><strong style="font-weight: 600">Is het spoed?</strong> Lees eerst dit</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="flex: 0 0 auto; transition: transform 400ms cubic-bezier(.22,.61,.36,1); transform: rotate(0deg)"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          
        </div>
      </div>
    

    

    
  </div>

  <div style="flex: 0 0 auto; padding: 12px 20px 30px">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 10px 14px; border-radius: 16px; background: #F7F3EB; border: 1px solid rgba(10,52,30,0.08); font-size: 13px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #CBA45C; flex: 0 0 auto"></span><span>Badkamer · Kraan</span></div>
    
      <button type="button" style="width: 100%; min-height: 56px; border: 0; border-radius: 999px; background: #0A341E; color: #F7F3EB; font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 16px; cursor: pointer">Verder</button>
    
    
  </div>
</div>
</body></html>
